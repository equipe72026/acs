<!doctype html>
<html lang="pt-BR" class="h-full">
<head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACS Conecta - Cadastro</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <style>
    .error-message { display: none; color: #f87171; font-size: 0.75rem; margin-top: 0.25rem; }
    .show-error + .error-message { display: block; }
    body { box-sizing: border-box; }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
</head>
<body class="min-h-full bg-slate-950 text-slate-100">
  <div id="app" class="min-h-screen w-full flex items-start md:items-center justify-center p-4 py-8">
    <div class="w-full max-w-2xl bg-slate-900 rounded-2xl border border-white/10 shadow-2xl overflow-hidden">

      <!-- Cabeçalho -->
      <div class="px-6 md:px-8 pt-7 pb-5 border-b border-white/5">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center flex-shrink-0">
            <i data-lucide="heart-pulse" style="width:20px;height:20px;" class="text-white"></i>
          </div>
          <span class="font-800 text-xl text-white">ACS Conecta</span>
        </div>
        <h1 id="tituloFormulario" class="text-2xl font-800 text-white mb-0.5">Criar Conta</h1>
        <p id="subtituloFormulario" class="text-slate-400 text-sm">Preencha os campos para registrar o novo agente</p>
      </div>

      <form id="signupForm" onsubmit="return validateForm(event)" class="px-6 md:px-8 py-6 space-y-6">

        <!-- Bloco 1: Dados Pessoais -->
        <div>
          <p class="text-[10px] font-800 text-emerald-400 uppercase tracking-wider mb-3">Dados Pessoais</p>
          <div class="space-y-3">
            <!-- Nome — linha inteira -->
            <div>
              <label for="name" class="block text-xs font-600 text-slate-300 mb-1">Nome completo *</label>
              <input type="text" id="name" placeholder="Mínimo 15 caracteres" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required minlength="15">
              <div class="error-message">O nome deve ter no mínimo 15 caracteres</div>
            </div>
            <!-- Nascimento + Sexo na mesma linha -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label for="birthdate" class="block text-xs font-600 text-slate-300 mb-1">Data de Nascimento *</label>
                <input type="text" id="birthdate" placeholder="DD/MM/AAAA" maxlength="10" oninput="maskDate(this)" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
              </div>
              <div>
                <label for="gender" class="block text-xs font-600 text-slate-300 mb-1">Sexo *</label>
                <select id="gender" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
                  <option value="" class="text-slate-400 bg-slate-900">Selecione</option>
                  <option value="M" class="text-white bg-slate-900">Masculino</option>
                  <option value="F" class="text-white bg-slate-900">Feminino</option>
                  <option value="O" class="text-white bg-slate-900">Outro</option>
                </select>
              </div>
            </div>
            <!-- Celular + Email na mesma linha -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label for="phone" class="block text-xs font-600 text-slate-300 mb-1">Celular *</label>
                <input type="tel" id="phone" oninput="maskPhone(this)" maxlength="15" placeholder="(XX) XXXXX-XXXX" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
                <div class="error-message">Formato obrigatório: (XX) XXXXX-XXXX</div>
              </div>
              <div>
                <label for="email" class="block text-xs font-600 text-slate-300 mb-1">Email *</label>
                <input type="email" id="email" placeholder="seu.email@exemplo.com" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
                <div class="error-message">Email inválido</div>
              </div>
            </div>
            <!-- CEP + Endereço + Número na mesma linha -->
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <div>
                <label for="cep" class="block text-xs font-600 text-slate-300 mb-1 flex items-center justify-between">
                  <span>CEP *</span>
                  <span id="cepStatus" class="text-[10px] font-700 text-slate-500 italic">Busca automática</span>
                </label>
                <input type="text" id="cep" placeholder="00000-000" maxlength="9" oninput="maskCep(this)" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm font-700 tracking-wide text-center transition-all" required>
              </div>
              <div class="sm:col-span-2">
                <label for="address" class="block text-xs font-600 text-slate-300 mb-1">Endereço *</label>
                <input type="text" id="address" placeholder="Rua, bairro..." class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
              </div>
              <div>
                <label for="numero" class="block text-xs font-600 text-slate-300 mb-1">Número *</label>
                <input type="text" id="numero" placeholder="Ex: 145" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
              </div>
            </div>
          </div>
        </div>

        <!-- Divisor -->
        <div class="border-t border-white/5"></div>

        <!-- Bloco 2: Acesso -->
        <div>
          <p class="text-[10px] font-800 text-emerald-400 uppercase tracking-wider mb-3">Acesso ao Sistema</p>
          <div class="space-y-3">
            <!-- Login — linha inteira -->
            <div>
              <label for="login" class="block text-xs font-600 text-slate-300 mb-1">Login *</label>
              <input type="text" id="login" placeholder="Nome de usuário para login" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
            </div>
            <!-- Senha + Confirmar Senha na mesma linha -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label for="password" class="block text-xs font-600 text-slate-300 mb-1">Senha *</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required minlength="6">
              </div>
              <div>
                <label for="confirmPassword" class="block text-xs font-600 text-slate-300 mb-1">Confirmar Senha *</label>
                <input type="password" id="confirmPassword" placeholder="Confirme sua senha" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
                <div class="error-message">As senhas devem ser iguais</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Divisor -->
        <div class="border-t border-white/5"></div>

        <!-- Bloco 3: Alocação -->
        <div>
          <p class="text-[10px] font-800 text-emerald-400 uppercase tracking-wider mb-3">Alocação Institucional</p>
          <div class="space-y-3">
            <!-- Unidade — linha inteira (desabilitada) -->
            <div>
              <label for="unitDisabled" class="block text-xs font-600 text-slate-300 mb-1">Unidade de Saúde *</label>
              <select id="unitDisabled" class="w-full px-3 py-2.5 rounded-xl bg-white/10 border border-white/10 text-slate-400 focus:outline-none text-sm cursor-not-allowed" disabled>
                <option value="CMS Adão Pereira Nunes" selected>CMS Adão Pereira Nunes</option>
              </select>
              <input type="hidden" id="unit" value="CMS Adão Pereira Nunes">
            </div>
            <!-- Equipe + Área na mesma linha -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label for="team" class="block text-xs font-600 text-slate-300 mb-1">Equipe *</label>
                <select id="team" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
                  <option value="" class="text-slate-400 bg-slate-900">Selecione a equipe</option>
                  <option value="Vitória de Paz" class="text-white bg-slate-900">Vitória de Paz</option>
                  <option value="Amizade" class="text-white bg-slate-900">Amizade</option>
                  <option value="Village das Palmeiras" class="text-white bg-slate-900">Village das Palmeiras</option>
                  <option value="Dicurana" class="text-white bg-slate-900">Dicurana</option>
                </select>
              </div>
              <div>
                <label for="area" class="block text-xs font-600 text-slate-300 mb-1">Área de Atuação *</label>
                <select id="area" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition-all" required>
                  <option value="" class="text-slate-400 bg-slate-900">Selecione a área</option>
                  <option value="01" class="text-white bg-slate-900">Área 01</option>
                  <option value="02" class="text-white bg-slate-900">Área 02</option>
                  <option value="03" class="text-white bg-slate-900">Área 03</option>
                  <option value="04" class="text-white bg-slate-900">Área 04</option>
                  <option value="05" class="text-white bg-slate-900">Área 05</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Botões -->
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <a href="gerencia.html" class="flex-1 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 font-700 text-sm transition-all text-center">Cancelar</a>
          <button id="btnSubmit" type="submit" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-700 text-sm transition-all duration-200 transform hover:scale-105">Cadastrar</button>
        </div>

      </form>

      <div class="px-6 md:px-8 pb-6 text-center border-t border-white/5 pt-4">
        <p class="text-[10px] text-slate-500">© 2024 ACS Conecta.</p>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const editIndex = params.get('edit');
    let agentes = JSON.parse(localStorage.getItem('agentes')) || [];

    function maskCep(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
      input.value = v;
      if (v.replace('-', '').length === 8) buscarCep(v.replace('-', ''));
    }

    function buscarCep(cepLimpo) {
      const status = document.getElementById('cepStatus');
      status.innerText = 'Buscando...';
      status.className = 'text-[10px] font-700 text-amber-400 animate-pulse';
      fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
        .then(r => r.json())
        .then(data => {
          if (data.erro) {
            status.innerText = 'CEP não encontrado';
            status.className = 'text-[10px] font-700 text-red-400';
            return;
          }
          const partes = [data.logradouro, data.bairro, data.localidade, data.uf].filter(Boolean);
          document.getElementById('address').value = partes.join(', ');
          status.innerText = 'Encontrado!';
          status.className = 'text-[10px] font-700 text-emerald-400';
          document.getElementById('numero').focus();
        })
        .catch(() => {
          status.innerText = 'Erro na busca';
          status.className = 'text-[10px] font-700 text-red-400';
        });
    }

    function maskPhone(input) {
      let value = input.value.replace(/\D/g, "");
      if (value.length > 11) value = value.slice(0, 11);
      if (value.length > 6) value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
      else if (value.length > 2) value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
      else if (value.length > 0) value = `(${value}`;
      input.value = value;
    }

    function maskDate(input) {
      let value = input.value.replace(/\D/g, "");
      if (value.length > 8) value = value.slice(0, 8);
      if (value.length > 4) value = `${value.slice(0, 2)}/${value.slice(2, 4)}/${value.slice(4)}`;
      else if (value.length > 2) value = `${value.slice(0, 2)}/${value.slice(2)}`;
      input.value = value;
    }

    function preencherEdicao() {
      if (editIndex === null) return;
      const agente = agentes[Number(editIndex)];
      if (!agente) return;

      document.getElementById('tituloFormulario').innerText = 'Editar Cadastro';
      document.getElementById('subtituloFormulario').innerText = 'Atualize os dados do agente';
      document.getElementById('btnSubmit').innerText = 'Salvar Alterações';

      document.getElementById('name').value = agente.name || '';
      document.getElementById('birthdate').value = agente.birthdate || '';
      document.getElementById('gender').value = agente.gender || '';
      document.getElementById('phone').value = agente.phone || '';
      document.getElementById('cep').value = agente.cep || '';
      document.getElementById('address').value = agente.address || '';
      document.getElementById('numero').value = agente.numero || '';
      document.getElementById('email').value = agente.email || '';
      document.getElementById('login').value = agente.login || '';
      document.getElementById('password').value = agente.password || '';
      document.getElementById('confirmPassword').value = agente.password || '';
      document.getElementById('unit').value = agente.unit || 'CMS Adão Pereira Nunes';
      document.getElementById('team').value = agente.team || '';
      document.getElementById('area').value = agente.area || '';
    }

    function validateForm(event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const birthdate = document.getElementById('birthdate').value.trim();
      const gender = document.getElementById('gender').value;
      const phone = document.getElementById('phone').value;
      const cep = document.getElementById('cep').value;
      const address = document.getElementById('address').value.trim();
      const numero = document.getElementById('numero').value.trim();
      const email = document.getElementById('email').value.trim();
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const unit = document.getElementById('unit').value;
      const team = document.getElementById('team').value;
      const area = document.getElementById('area').value;

      let isValid = true;

      if (password !== confirmPassword) {
        document.getElementById('confirmPassword').classList.add('show-error');
        isValid = false;
      } else {
        document.getElementById('confirmPassword').classList.remove('show-error');
      }

      const phoneRegex = /^\(\d{2}\)\s\d{5}-\d{4}$/;
      if (!phoneRegex.test(phone)) {
        document.getElementById('phone').classList.add('show-error');
        isValid = false;
      } else {
        document.getElementById('phone').classList.remove('show-error');
      }

      if (!birthdate) {
        alert('Informe a data de nascimento.');
        return false;
      }

      if (!isValid) return false;

      const novoAgente = {
        name, birthdate, gender, phone, cep, address, numero, email, login, password, unit, team, area,
        familias: 0,
        visitas: 0,
        consultas: 0
      };

      if (editIndex !== null) {
        const idx = Number(editIndex);
        const loginConflito = agentes.some((a, i) => a.login === login && i !== idx);
        if (loginConflito) {
          alert('Este nome de usuário (login) já está em uso.');
          return false;
        }

        novoAgente.familias = agentes[idx]?.familias ?? 0;
        novoAgente.visitas = agentes[idx]?.visitas ?? 0;
        novoAgente.consultas = agentes[idx]?.consultas ?? 0;

        agentes[idx] = novoAgente;
        localStorage.setItem('agentes', JSON.stringify(agentes));
        alert('Cadastro atualizado com sucesso!');
        window.location.href = 'gerencia.html';
        return false;
      }

      if (agentes.some(a => a.login === login)) {
        alert('Este nome de usuário (login) já está em uso.');
        return false;
      }

      agentes.push(novoAgente);
      localStorage.setItem('agentes', JSON.stringify(agentes));
      alert('Agente comunitário cadastrado com sucesso!');
      window.location.href = 'gerencia.html';
      return false;
    }

    preencherEdicao();
  </script>

</body>
</html>
